apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: final-web-app:latest
        imagePullPolicy: Never
        env:
        - name: STUDENT_NAME
          value: "AISWARYA S NAIR"
